/* ====== TEMA (modificabile) ====== */
:root{
  --bg:#04051a;
  --gold:#FFD21F;
  --white:#f4f4ff;
  --purple:#b44bff;
  --pink:#ff45d8;
  --blue:#4f6bff;
  --cyan:#1fe0ff;
  --divider:#d43cff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:radial-gradient(ellipse 80% 60% at 50% 45%,#0b0d33,transparent 75%),var(--bg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:1024px;height:1536px;transform-origin:center center;flex:none}
#stage{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(ellipse 70% 45% at 50% 40%, #0b0d33 0%, transparent 70%),
  radial-gradient(ellipse 60% 30% at 50% 100%, #2a0a4a 0%, transparent 70%),
  var(--bg);
  animation:tvOn .9s cubic-bezier(.2,.8,.2,1) both;}

/* ====== accensione TV di tutto il poster ====== */
@keyframes tvOn{
  0%{clip-path:inset(50% 50% 50% 50%);filter:brightness(6)}
  25%{clip-path:inset(49.6% 0 49.6% 0);filter:brightness(6)}
  60%{clip-path:inset(0 0 0 0);filter:brightness(2.2) saturate(.4)}
  100%{clip-path:inset(0 0 0 0);filter:none}
}
#stage.off{animation:tvOff .55s cubic-bezier(.6,0,.9,.4) both}
@keyframes tvOff{
  0%{clip-path:inset(0 0 0 0);filter:none}
  40%{clip-path:inset(49.6% 0 49.6% 0);filter:brightness(5)}
  80%{clip-path:inset(49.6% 49% 49.6% 49%);filter:brightness(6)}
  100%{clip-path:inset(50% 50% 50% 50%);filter:brightness(6)}
}

/* ====== stelle ====== */
.stars{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%}
.s1{animation:twinkle 3.1s ease-in-out infinite alternate}
.s2{animation:twinkle 4.3s ease-in-out -1.7s infinite alternate}
.s3{animation:twinkle 2.3s ease-in-out -0.9s infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}

/* ====== griglia synthwave in basso ====== */
.grid{position:absolute;left:-50%;width:200%;bottom:0;height:260px;perspective:260px;
  -webkit-mask:linear-gradient(to bottom,transparent 0%,#000 55%);mask:linear-gradient(to bottom,transparent 0%,#000 55%)}
.grid i{position:absolute;inset:-100% 0 0 0;transform:rotateX(62deg);transform-origin:50% 100%;
  background:
   repeating-linear-gradient(90deg, rgba(213,60,255,.55) 0 2px, transparent 2px 64px),
   repeating-linear-gradient(0deg, rgba(213,60,255,.55) 0 2px, transparent 2px 64px);
  animation:gridMove 2.4s linear infinite}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:0 0,0 64px}}

/* ====== icone in alto ====== */
.icon{position:absolute}
.icon .strike{width:100%;height:100%}
.icon img{display:block;width:100%;height:100%}
#tw{left:200px;top:40px;width:180px;height:155px}
#yt{left:645px;top:45px;width:185px;height:145px}
#logo{left:400px;top:40px;width:220px;height:150px}
/* neon che si accende a scatti */
.strike{animation:neonStrike 1.1s steps(1,end) both}
#tw .strike{animation-delay:.9s}
#yt .strike{animation-delay:1.15s}
@keyframes neonStrike{
  0%{opacity:0}8%{opacity:.9}12%{opacity:.1}20%{opacity:1}24%{opacity:.15}
  34%{opacity:.8}38%{opacity:.3}46%{opacity:1}100%{opacity:1}}
/* respiro del neon + sfarfallio ogni tanto */
#tw img{animation:breathTw 2.6s ease-in-out 2s infinite alternate, flick 9s steps(1,end) 6s infinite}
#yt img{animation:breathYt 2.6s ease-in-out 2.6s infinite alternate, flick 11s steps(1,end) 8.5s infinite}
@keyframes breathTw{from{filter:brightness(1) drop-shadow(0 0 6px rgba(180,75,255,.5))}
  to{filter:brightness(1.3) drop-shadow(0 0 22px rgba(180,75,255,.95))}}
@keyframes breathYt{from{filter:brightness(1) drop-shadow(0 0 6px rgba(255,40,40,.5))}
  to{filter:brightness(1.3) drop-shadow(0 0 22px rgba(255,40,40,.95))}}
@keyframes flick{0%{opacity:1}1%{opacity:.25}1.6%{opacity:1}2.3%{opacity:.4}3%{opacity:1}100%{opacity:1}}
/* logo: accensione CRT + glitch RGB + leggero galleggiare */
#logo .crt{animation:crtOn .7s cubic-bezier(.2,.8,.2,1) .55s both}
#logo .float{animation:float 4s ease-in-out 1.5s infinite alternate}
#logo .gl{position:relative}
#logo .gl img{position:relative}
#logo .gl::before,#logo .gl::after{content:"";position:absolute;inset:0;background:var(--logo) center/100% 100% no-repeat;mix-blend-mode:screen;opacity:0}
#logo .gl::before{filter:url(#onlyR);animation:logoSplitR 7s steps(1,end) 3s infinite}
#logo .gl::after{filter:url(#onlyC);animation:logoSplitC 7s steps(1,end) 3s infinite}
@keyframes logoSplitR{0%{opacity:.9;transform:translate(-6px,0)}2%{transform:translate(-3px,2px)}4%{opacity:.9;transform:translate(-8px,-1px)}6%{opacity:0;transform:none}100%{opacity:0}}
@keyframes logoSplitC{0%{opacity:.9;transform:translate(6px,0)}2%{transform:translate(4px,-2px)}4%{opacity:.9;transform:translate(7px,1px)}6%{opacity:0;transform:none}100%{opacity:0}}
@keyframes float{from{transform:translateY(-3px)}to{transform:translateY(3px)}}

/* ====== bordi LED (SVG) ====== */
#leds{position:absolute;inset:0;overflow:visible;pointer-events:none}
.base{fill:none;stroke-width:3.4;opacity:.8}
.base.thin{stroke-width:1.6;opacity:.45}
.dots{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:.01 5.5;opacity:.22}
.halo{fill:none;stroke-width:10;opacity:.5;filter:url(#blur8)}
.comet{fill:none;stroke-linecap:round}
.c1{stroke-width:6;opacity:.35;stroke-dasharray:240 760;animation:run240 var(--p) linear infinite}
.c2{stroke-width:6;opacity:.7;stroke-dasharray:130 870;animation:run130 var(--p) linear infinite}
.c3{stroke-width:7;opacity:1;stroke-dasharray:55 945;animation:run55 var(--p) linear infinite}
.c4{stroke:#fff;stroke-width:3.2;opacity:1;stroke-dasharray:24 976;animation:run24 var(--p) linear infinite}
.glow{filter:url(#glow)}
@keyframes run240{from{stroke-dashoffset:240}to{stroke-dashoffset:-760}}
@keyframes run130{from{stroke-dashoffset:130}to{stroke-dashoffset:-870}}
@keyframes run55{from{stroke-dashoffset:55}to{stroke-dashoffset:-945}}
@keyframes run24{from{stroke-dashoffset:24}to{stroke-dashoffset:-976}}
.ledIn{animation:ledIn 1s ease-out .7s both}
@keyframes ledIn{0%{opacity:0}30%{opacity:1}36%{opacity:.2}50%{opacity:1}100%{opacity:1}}
.dotsPanel{position:absolute;left:100px;top:360px;width:816px;height:1084px;border-radius:22px;
  background:radial-gradient(circle,rgba(150,160,255,.16) 1px,transparent 1.4px) 0 0/14px 14px;
  -webkit-mask:linear-gradient(90deg,#000,transparent 18%,transparent 82%,#000);mask:linear-gradient(90deg,#000,transparent 18%,transparent 82%,#000)}
.panelFill{position:absolute;left:86px;top:347px;width:844px;height:1111px;border-radius:30px;background:rgba(2,3,14,.82)}
.titleFill{position:absolute;left:92px;top:207px;width:836px;height:114px;border-radius:20px;background:rgba(2,3,14,.85)}

/* ====== testi ====== */
.line{position:absolute;left:0;width:1024px;text-align:center;white-space:nowrap;line-height:1}
.line .crt,.line .gl{display:inline-block}
.day{font-family:"Exo2";font-weight:700;font-size:47px;color:var(--gold);letter-spacing:.5px;
  text-shadow:0 0 14px rgba(255,190,0,.45)}
.info{font-family:"Exo2";font-weight:600;font-size:34px;color:var(--white);
  text-shadow:0 0 10px rgba(200,210,255,.25)}
.title{font-family:"Saira C";font-weight:800;font-size:77px;letter-spacing:.5px;top:226px}
.title .w{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.35)}
.title .g{background:linear-gradient(90deg,#16f0ff 0%,#2fa0ff 35%,#6b5bff 60%,#c04bff 80%,#ff4fd8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(80,140,255,.55))}
.hr{position:absolute;left:130px;width:762px;height:2px;background:linear-gradient(90deg,transparent,var(--divider) 8%,#ff6ff0 50%,var(--divider) 92%,transparent);
  box-shadow:0 0 10px rgba(212,60,255,.8);transform-origin:center;animation:hrIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes hrIn{from{transform:scaleX(0);opacity:0;filter:brightness(4)}to{transform:scaleX(1);opacity:1;filter:none}}

/* accensione stile tubo catodico */
.crt{animation:crtOn .62s cubic-bezier(.2,.8,.2,1) both}
@keyframes crtOn{
  0%{opacity:0;transform:scale(1.35,.02);filter:brightness(5) blur(1px)}
  14%{opacity:1;transform:scale(1.35,.03);filter:brightness(5) blur(1px)}
  42%{transform:scale(.96,1.18);filter:brightness(2.4);text-shadow:-6px 0 rgba(255,0,70,.9),6px 0 rgba(0,240,255,.9)}
  58%{transform:scale(1.02,.9);text-shadow:-3px 0 rgba(255,0,70,.8),3px 0 rgba(0,240,255,.8)}
  74%{transform:scale(1,1.03);filter:brightness(1.5);opacity:.75}
  80%{opacity:1}
  100%{opacity:1;transform:none;filter:none}
}
/* glitch casuale in idle (split RGB + strappo) */
.gl{animation:glitch var(--gp,12s) steps(1,end) var(--gd,8s) infinite}
@keyframes glitch{
  0%{transform:translateX(-7px) skewX(-8deg);text-shadow:-4px 0 rgba(255,0,70,.9),4px 0 rgba(0,240,255,.9);filter:brightness(1.6)}
  1%{transform:translateX(5px);text-shadow:3px 0 rgba(255,0,70,.9),-3px 0 rgba(0,240,255,.9)}
  2%{transform:translateX(-2px) skewX(4deg);opacity:.6}
  3%{transform:none;text-shadow:none;filter:none;opacity:1}
  100%{transform:none}
}
.title .gl{animation-name:glitchT}
@keyframes glitchT{
  0%{transform:translateX(-8px) skewX(-6deg);filter:brightness(1.5) drop-shadow(-5px 0 rgba(255,0,70,.9)) drop-shadow(5px 0 rgba(0,240,255,.9))}
  1.2%{transform:translateX(6px);filter:drop-shadow(4px 0 rgba(255,0,70,.9)) drop-shadow(-4px 0 rgba(0,240,255,.9))}
  2.4%{transform:none;filter:none}
  100%{transform:none}
}

/* ====== giorni passati / oggi / weekend ====== */
#rows,.grp{position:absolute;inset:0}
.grp.past{animation:toGrey 1s linear var(--gd2,6.4s) both}
@keyframes toGrey{
  0%{filter:none;transform:none}
  8%{filter:brightness(2.2) grayscale(.5);transform:translateX(-6px)}
  14%{filter:none;transform:translateX(4px)}
  20%{filter:grayscale(1) brightness(1.6);transform:none}
  26%{filter:none}
  34%{filter:grayscale(1) brightness(.5);opacity:.75}
  100%{filter:grayscale(1) brightness(.5);opacity:.75}
}
.grp.today .day{animation:todayPulse 1.4s ease-in-out var(--td,4s) infinite alternate}
@keyframes todayPulse{from{filter:drop-shadow(0 0 2px rgba(255,200,0,.3))}to{filter:drop-shadow(0 0 16px rgba(255,200,0,.95)) brightness(1.15)}}
.arrow{display:inline-block;font-family:"JBM";font-weight:700;font-size:34px;color:#35F2A0;vertical-align:middle;margin:0 18px;
  text-shadow:0 0 10px rgba(53,242,160,.9);animation:blink 1s steps(1,end) var(--td,4s) infinite;opacity:0}
@keyframes blink{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
.nextweek{position:absolute;left:0;width:1024px;top:560px;text-align:center;transform:rotate(-7deg);pointer-events:none}
.nextweek .band{position:absolute;left:60px;right:60px;top:20px;bottom:20px;background:rgba(2,3,14,.8);filter:blur(22px)}
.nextweek .crt{display:block;animation-delay:7.6s}
.nextweek .gl{display:block;--gd:10s;--gp:6s;animation-name:glitchT}
.nextweek .t{display:block;font-family:"Saira C";font-weight:800;line-height:.95;letter-spacing:2px;
  background:linear-gradient(90deg,#16f0ff 0%,#2fa0ff 30%,#6b5bff 55%,#c04bff 75%,#ff4fd8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 16px rgba(120,120,255,.8))}
.nextweek .t1{font-size:150px}
.nextweek .t2{font-size:170px}

/* ====== formato storia 9:16 (?story=1) ====== */
.story #wrap{height:1820px}
.story #stage{inset:auto;left:0;top:142px;width:1024px;height:1536px;overflow:visible;background:transparent;animation-name:tvOnS}
.story .grid{bottom:-142px;height:360px}
.story .scan,.story .vignette,.story .flicker{inset:-142px 0}
.story .retrace{top:-282px}
@keyframes tvOnS{
  0%{clip-path:inset(50% 50% 50% 50%);filter:brightness(6)}
  25%{clip-path:inset(49.6% 0 49.6% 0);filter:brightness(6)}
  60%{clip-path:inset(-12% 0 -12% 0);filter:brightness(2.2) saturate(.4)}
  100%{clip-path:inset(-12% 0 -12% 0);filter:none}
}

/* ====== effetti schermo ====== */
.scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.retrace{position:absolute;left:0;right:0;height:120px;top:-140px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(140,170,255,.035) 70%,rgba(200,220,255,.07) 96%,transparent);
  animation:retrace 7s linear 2s infinite}
@keyframes retrace{from{transform:translateY(0)}to{transform:translateY(1820px)}}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)}
.flicker{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;animation:flk 5.3s steps(1,end) 3s infinite}
@keyframes flk{0%{opacity:.03}2%{opacity:0}40%{opacity:.02}41%{opacity:0}100%{opacity:0}}
</style>
</head>

<div id="wrap">
  <div id="stage"></div>
</div>

  <div class="stars s1"></div><div class="stars s2"></div><div class="stars s3"></div>

    </g>

    <!-- pannello principale -->

        <rect class="comet c1" x="84" y="345" width="848" height="1115" rx="32" pathLength="1000" stroke="url(#gBorder)" style="animation-delay:-4s"/>
        <rect class="comet c2" x="84" y="345" width="848" height="1115" rx="32" pathLength="1000" stroke="url(#gBorder)" style="animation-delay:-4s"/>

function build(){
  var stage = document.getElementById("stage");
  stage.innerHTML = document.getElementById("tpl").innerHTML;
  // logo per il glitch RGB
  var li = stage.querySelector("#logo img");
  stage.querySelector("#logo").style.setProperty("--logo","url("+li.src+")");
  // stelle (posizioni fisse, generate con seme)
  var r = rng(42);
  ["s1","s2","s3"].forEach(function(c,k){
    var sh=[];
    for(var n=0;n<55;n++){
      var x=Math.round(r()*1024), y=Math.round(r()*(STORY?1820:1536))-(STORY?142:0), a=(0.4+r()*0.6).toFixed(2);
      var col = r()<0.2 ? "160,140,255" : (r()<0.2 ? "120,220,255" : "255,255,255");
      sh.push(x+"px "+y+"px "+(r()<0.12?"1px":"0")+" rgba("+col+","+a+")");
    }
    stage.querySelector("."+c).style.boxShadow = sh.join(",");
  });
  // righe
  var rowsBox = stage.querySelector("#rows"), t = START, rr = rng(7), grps = {}, npast = 0;
  ROWS.forEach(function(row){
    var g = row[3];
    if(!grps[g]){
      var gd=document.createElement("div"); gd.className="grp";
      if(g<TODAY_GRP){ gd.className+=" past"; gd.style.setProperty("--gd2",(6.2+npast*0.22).toFixed(2)+"s"); npast++; }
      if(g===TODAY_GRP) gd.className+=" today";
      rowsBox.appendChild(gd); grps[g]=gd;
    }
    var box = grps[g];
    if(row[2]==="hr"){
      var h=document.createElement("div"); h.className="hr"; h.style.top=row[1]+"px";
      h.style.animationDelay=(t-0.05).toFixed(2)+"s"; box.appendChild(h); t+=STEP*0.6; return;
    }
    var el=document.createElement("div");
    el.className="line "+(row[2]==="d"?"day":"info");
    el.style.top=(row[1]-(row[2]==="d"?24:17))+"px";
    var gp=(10+rr()*14).toFixed(1), gd=(t+3+rr()*12).toFixed(1);
    el.innerHTML='<span class="crt" style="animation-delay:'+t.toFixed(2)+'s"><span class="gl" style="--gp:'+gp+'s;--gd:'+gd+'s"></span></span>';
    el.querySelector(".gl").textContent=row[0];
    if(row[2]==="d" && g===TODAY_GRP){
      var gl=el.querySelector(".gl"), a1=document.createElement("span"), a2=document.createElement("span");
      a1.className=a2.className="arrow"; a1.textContent="▶"; a2.textContent="◀";
      gl.insertBefore(a1,gl.firstChild); gl.appendChild(a2);
    }
    box.appendChild(el); t+=STEP;
  });
  if(WEEKEND){
    var nw=document.createElement("div"); nw.className="nextweek";
    nw.innerHTML='<div class="band"></div><span class="crt"><span class="gl"><span class="t t1">SEE YOU</span><span class="t t2">NEXT WEEK</span></span></span>';
    rowsBox.appendChild(nw);
  }
}

function fit(){
  var s=Math.min(innerWidth/1024, innerHeight/H);
  document.getElementById("wrap").style.transform="scale("+s+")";
  document.getElementById("wrap").style.height=H+"px";
}
addEventListener("resize",fit); fit();
build();

if(LOOP>0){
  setInterval(function(){
    var st=document.getElementById("stage");
    st.classList.add("off");
    setTimeout(function(){
      st.classList.remove("off");
      st.style.animation="none"; void st.offsetWidth; st.style.animation="";
      build();
    },700);
  }, LOOP*1000);
}
</script>
</body>
</html>
